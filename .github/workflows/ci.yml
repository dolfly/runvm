name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build (no engine)
        run: go build ./...

      - name: build (unicorn engine)
        run: go build -tags unicorn ./...

      - name: test
        run: go test ./...

  e2e:
    # The unit tests never boot an emulator or a browser, so this job is the
    # only thing standing between us and "works on my machine": real WebKit, a
    # real Xvfb, a real unicorn, a real AArch64 library.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: webkit + xvfb
        # Non-interactive matters: needrestart can block an apt step forever
        # on these images, which is indistinguishable from a slow mirror.
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo -E apt-get install -y -qq libwebkit2gtk-4.1-0 xvfb libgl1-mesa-dri x11-apps

      - name: libunicorn
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        timeout-minutes: 5
        run: |
          if sudo -E apt-get install -y -qq libunicorn2; then
            echo "using the distro libunicorn"
          else
            echo "no distro package; taking the one from the python wheel"
            python3 -m pip install --quiet --user unicorn
            LIB=$(python3 -c 'import os,unicorn;print(os.path.join(os.path.dirname(unicorn.__file__),"lib","libunicorn.so.2"))')
            echo "GOLEM_UNICORN=$LIB" >> "$GITHUB_ENV"
          fi

      - name: fixture (golem sysroot + sample .so)
        run: git clone --depth 1 https://github.com/isesword/golem /tmp/golem

      - name: build
        run: make build

      - name: e2e
        timeout-minutes: 10
        env:
          RUNVM_ASSETS: /tmp/golem/assets
          HOME: /tmp
        run: python3 scripts/e2e.py /tmp/golem/examples/native/native.so

  platforms:
    # The Linux job proves the backends work end to end; this one proves the
    # code builds and bootstraps where runvm is meant to run but a Linux box
    # cannot check: WKWebView on macOS, WebView2 on Windows. It is the
    # precondition for ever touching the screenshot/print fork.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build (unicorn engine)
        run: go build -tags unicorn ./...

      - name: test (unit only, no backends)
        run: go test ./internal/mcp/ ./internal/session/ ./internal/android/

      - name: unicorn (macOS)
        if: runner.os == 'macOS'
        # golem probes /opt/homebrew/opt/unicorn/lib itself, so installing the
        # formula is enough to make the Android backend real on this runner.
        run: brew install unicorn

      - name: unicorn (Windows)
        if: runner.os == 'Windows'
        # The DLL ships inside golem's module; point golem at it explicitly,
        # since its default relative lookup is resolved from the cwd.
        shell: pwsh
        run: |
          $dir = go list -m -f '{{.Dir}}' github.com/isesword/golem
          $dll = Join-Path $dir 'assets\windows\amd64\unicorn.dll'
          if (-not (Test-Path $dll)) { throw "no unicorn.dll at $dll" }
          "GOLEM_UNICORN=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: version
        run: go run -tags unicorn ./cmd/runvm version

      - name: doctor (boots the platform webview)
        run: go run -tags unicorn ./cmd/runvm doctor
