name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build (no engine)
        run: go build ./...

      - name: build (unicorn engine)
        run: go build -tags unicorn ./...

      - name: test
        run: go test ./...

  web:
    # The frontend ships as committed build output (no Node at Go build time),
    # so this job proves the source still reproduces that output exactly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npm run check

      - name: locale key parity
        working-directory: web
        run: npm run check:locales

      - name: build
        working-directory: web
        run: npm run build

      - name: drift check
        # `git status --porcelain` sees untracked files too, unlike
        # `git diff --exit-code` which only compares tracked files and would
        # silently miss a brand-new hashed asset.
        run: |
          if [ -n "$(git status --porcelain -- internal/console/static/dist)" ]; then
            echo "frontend dist drifted from committed build; run 'make web' and commit the output"
            git status --porcelain -- internal/console/static/dist
            exit 1
          fi

  console-e2e:
    # The console is a real SPA; API-level checks cannot catch a save landing
    # on the wrong path. This job boots `runvm http` and drives the real UI in
    # a real Chromium (Playwright), asserting DOM and resource content — not
    # just HTTP status.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build runvm
        run: CGO_ENABLED=0 go build -o bin/runvm ./cmd/runvm

      - name: frontend deps + chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: console e2e (real browser)
        working-directory: web
        run: |
          set -e
          RESDIR=$(mktemp -d)
          mkdir -p "$RESDIR/docs"
          printf '{"hello":"world"}' > "$RESDIR/docs/e2e.json"
          printf '# Hello\n\nThis is **markdown**.\n' > "$RESDIR/docs/readme.md"
          printf 'plain text line\n' > "$RESDIR/docs/notes.txt"
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC' | base64 -d > "$RESDIR/docs/pixel.png"
          RUNVM_RESOURCES_DIR="$RESDIR" RUNVM_CONSOLE_USER=admin RUNVM_CONSOLE_PASSWORD=secret123 \
            RUNVM_HTTP_ADDR=127.0.0.1:18767 ../bin/runvm http >/tmp/runvm-console.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:18767/healthz && break
            sleep 0.5
          done
          BASE_URL=http://127.0.0.1:18767 npx playwright test

  e2e:
    # The unit tests never boot an emulator or a browser, so this job is the
    # only thing standing between us and "works on my machine": real WebKit, a
    # real Xvfb, a real unicorn, a real AArch64 library.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: webkit + xvfb
        # Non-interactive matters: needrestart can block an apt step forever
        # on these images, which is indistinguishable from a slow mirror.
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        timeout-minutes: 10
        run: |
          # The runner image starts unattended-upgrades at boot, which holds the
          # dpkg lock: apt then waits forever instead of failing. Stop it, and
          # make apt itself wait for the lock rather than hanging silently.
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo systemctl disable unattended-upgrades 2>/dev/null || true
          sudo pkill -f unattended-upgrade 2>/dev/null || true

          apt="sudo -E apt-get -o DPkg::Lock::Timeout=180"
          for attempt in 1 2 3; do
            echo "apt attempt $attempt"
            if timeout 300 $apt update -qq &&
               timeout 500 $apt install -y -qq libwebkit2gtk-4.1-0 xvfb libgl1-mesa-dri x11-apps; then
              exit 0
            fi
            sleep 15
          done
          echo "apt failed three times"
          exit 1

      - name: libunicorn
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        timeout-minutes: 5
        run: |
          if sudo -E apt-get install -y -qq libunicorn2; then
            echo "using the distro libunicorn"
          else
            echo "no distro package; taking the one from the python wheel"
            python3 -m pip install --quiet --user unicorn
            LIB=$(python3 -c 'import os,unicorn;print(os.path.join(os.path.dirname(unicorn.__file__),"lib","libunicorn.so.2"))')
            echo "GOLEM_UNICORN=$LIB" >> "$GITHUB_ENV"
          fi

      - name: fixture (golem sysroot + sample .so)
        run: git clone --depth 1 https://github.com/isesword/golem /tmp/golem

      - name: build
        run: make build

      - name: e2e
        timeout-minutes: 10
        env:
          RUNVM_ASSETS: /tmp/golem/assets
          HOME: /tmp
        run: python3 scripts/e2e.py /tmp/golem/examples/native/native.so

  platforms:
    # The Linux job proves the backends work end to end; this one proves the
    # code builds and bootstraps where runvm is meant to run but a Linux box
    # cannot check: WKWebView on macOS, WebView2 on Windows. It is the
    # precondition for ever touching the screenshot/print fork.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build (unicorn engine)
        run: go build -tags unicorn ./...

      - name: test (unit only, no backends)
        run: go test ./internal/mcp/ ./internal/session/ ./internal/android/ ./internal/ios/ ./internal/tools/

      - name: unicorn (macOS)
        if: runner.os == 'macOS'
        # golem probes /opt/homebrew/opt/unicorn/lib itself, so installing the
        # formula is enough to make the Android backend real on this runner.
        run: brew install unicorn

      - name: unicorn (Windows)
        if: runner.os == 'Windows'
        # The DLL ships inside golem's module; point golem at it explicitly,
        # since its default relative lookup is resolved from the cwd.
        shell: pwsh
        run: |
          $dir = go list -m -f '{{.Dir}}' github.com/isesword/golem
          $dll = Join-Path $dir 'assets\windows\amd64\unicorn.dll'
          if (-not (Test-Path $dll)) { throw "no unicorn.dll at $dll" }
          "GOLEM_UNICORN=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: version
        run: go run -tags unicorn ./cmd/runvm version

      - name: doctor (boots the platform webview)
        run: go run -tags unicorn ./cmd/runvm doctor

      - name: selftest (open a page, capture it, check it painted)
        shell: bash
        run: |
          set +e
          out=$(go run -tags unicorn ./cmd/runvm selftest 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ] && echo "$out" | grep -q "not supported on this platform"; then
            echo "::warning::screenshot not supported on this platform yet"
            echo "screenshot not supported on this platform yet — skipping"
            exit 0
          fi
          exit "$code"
