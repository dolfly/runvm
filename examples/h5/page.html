<!doctype html>
<meta charset="utf-8">
<title>runvm demo</title>
<div id="app"></div>
<script>
  const app = document.getElementById("app");

  document.getElementById("save").onclick = () => { app.dataset.saved = "yes"; console.log("clicked"); };
  console.log("page ready", document.title);
</script>
