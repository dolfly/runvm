<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>runvm 控制台</title>
  <link rel="stylesheet" href="/console.css">
</head>
<body>
  <div id="login-view" class="hidden">
    <form id="login-form" class="card narrow">
      <h1>runvm 控制台</h1>
      <p class="muted">HTTP 模式下的实时状态、资源浏览编辑、上传与 MCP 调试。</p>
      <label>用户名
        <input name="username" autocomplete="username" required>
      </label>
      <label>密码
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary">登录</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </div>

  <div id="app-view" class="hidden">
    <header>
      <div class="brand">runvm <span class="muted">控制台</span></div>
      <nav>
        <button data-tab="status" class="active">状态</button>
        <button data-tab="resources">资源</button>
        <button data-tab="upload">上传</button>
        <button data-tab="debug">MCP 调试</button>
      </nav>
      <button id="logout" class="ghost">退出</button>
    </header>

    <main>
      <section id="tab-status" class="tab active">
        <h2>实时运行状态</h2>
        <p class="muted">每 3 秒自动刷新。</p>
        <div id="status-body"><p class="muted">加载中…</p></div>
      </section>

      <section id="tab-resources" class="tab">
        <h2>资源浏览</h2>
        <div id="resources-body"><p class="muted">加载中…</p></div>
        <div id="resource-detail" class="hidden"></div>
      </section>

      <section id="tab-upload" class="tab">
        <h2>上传</h2>
        <form id="upload-form" class="card">
          <label>目标名（可选，相对路径）
            <input name="target" placeholder="留空使用文件名">
          </label>
          <label>文件
            <input name="file" type="file" required>
          </label>
          <button type="submit" class="primary">上传</button>
        </form>
        <p id="upload-result" class="hidden"></p>
      </section>

      <section id="tab-debug" class="tab">
        <h2>MCP 调试</h2>
        <p class="muted">只读：连的是 runvm 自己，写工具与状态变更工具没有调用入口。</p>
        <div id="debug-body"><p class="muted">加载中…</p></div>
      </section>
    </main>
  </div>

  <script src="/console.js"></script>
</body>
</html>
